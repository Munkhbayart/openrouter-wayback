name: Wayback catalog pilot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wayback-collector
  cancel-in-progress: false

jobs:
  catalog-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install browser and parser
        run: |
          python -m pip install playwright beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Inspect catalog and create CSV
        run: python -u scripts/catalog_pilot.py
      - name: Commit CSV and coverage report
        if: always()
        run: |
          if [ ! -d data ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog/ data/coverage/ 2>/dev/null || git add data/coverage/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save October 18 catalog pilot and coverage report'
          git push
      - name: Save inspection files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wayback-catalog-pilot
          path: pilot-output/
          retention-days: 7
